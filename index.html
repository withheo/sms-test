<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>연락하기</title>
<style>
  body{font-family:sans-serif;text-align:center;padding:40px 16px}
  a.btn{display:block;max-width:320px;margin:14px auto;padding:16px;border-radius:12px;
        background:#2481cc;color:#fff;text-decoration:none;font-size:18px}
  a.btn.tel{background:#2e7d32}
  a.btn.open{background:#f57c00}
  a.btn.copy{background:#6a1b9a;font-size:15px}
  #n{font-size:22px;margin-bottom:8px}
  #m{color:#555;font-size:14px;margin:0 auto 24px;max-width:320px;white-space:pre-wrap}
  [hidden]{display:none!important}
</style>
</head><body>
<p id="n"></p>
<p id="m"></p>
<a id="sms" class="btn" hidden>문자 보내기</a>
<a id="sms2" class="btn copy" hidden>문자 보내기 (다른 방식)</a>
<a id="sms3" class="btn copy" hidden>문자 보내기 (방식 3)</a>
<a id="copy" class="btn copy" hidden href="#" onclick="copyMsg(event)">📋 문구 복사 (본문이 안 채워질 때)</a>
<a id="tel" class="btn tel" hidden>전화 걸기</a>
<a id="open" class="btn open" hidden>🌐 Chrome으로 글 열기</a>
<p id="none" hidden>정보가 없습니다.</p>
<script>
  // 주소 형식 (# 뒤는 서버로 전송되지 않음)
  //  문자/전화: .../#n=01077858661&m=문자내용
  //  글 열기:   .../#u=https%3A%2F%2Fexample.com%2Fpost  (Chrome 으로 열기)
  //  예전 형식 .../#01077858661 도 동작
  const raw = location.hash.slice(1);
  const params = new URLSearchParams(raw.includes('=') ? raw : 'n=' + raw);
  const num = (params.get('n') || '').replace(/[^0-9+]/g, '');
  const msg = params.get('m') || '';
  const url = params.get('u') || '';
  const $ = (id) => document.getElementById(id);
  function copyMsg(e) {
    e.preventDefault();
    const done = () => { $('copy').textContent = '✅ 복사됨 - 문자 입력창에 붙여넣으세요'; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(msg).then(done, () => fallbackCopy(done));
    } else fallbackCopy(done);
  }
  function fallbackCopy(done) {
    const t = document.createElement('textarea');
    t.value = msg; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); done(); } catch (_) {}
    t.remove();
  }

  if (num) {
    $('n').textContent = num;
    $('m').textContent = msg;
    // 기기별 본문 형식: 안드로이드 sms:번호?body=내용 / iOS sms:번호&body=내용
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const std = 'sms:' + num + (msg ? (isIOS ? '&' : '?') + 'body=' + encodeURIComponent(msg) : '');
    if (/android/i.test(navigator.userAgent) && msg) {
      // 안드로이드: 문자 앱을 인텐트로 직접 호출 (sms_body 로 본문 전달) → 기본 버튼
      $('sms').href = 'intent:' + num + '#Intent;scheme=smsto;action=android.intent.action.SENDTO;S.sms_body=' + encodeURIComponent(msg) + ';end';
      $('sms2').href = std; // 보조: 일반 sms: 링크
      $('sms2').hidden = false;
    } else if (isIOS && msg) {
      // iOS 는 버전마다 되는 형식이 달라 3가지를 모두 제공 (되는 것을 알려주면 하나로 정리)
      const b = encodeURIComponent(msg);
      $('sms').href = 'sms:' + num + '&body=' + b;                    // 방식 1
      $('sms2').href = 'sms:/open?addresses=' + num + '&body=' + b;   // 방식 2
      $('sms3').href = 'sms:' + num + '?&body=' + b;                  // 방식 3
      $('sms').textContent = '문자 보내기 (방식 1)';
      $('sms2').textContent = '문자 보내기 (방식 2)';
      $('sms3').textContent = '문자 보내기 (방식 3)';
      $('sms2').hidden = false;
      $('sms3').hidden = false;
    } else {
      $('sms').href = std;
    }
    if (msg) $('copy').hidden = false;
    $('tel').href = 'tel:' + num;
    $('sms').hidden = false;
    $('tel').hidden = false;
  }
  if (/^https?:\/\//i.test(url)) {
    const m = url.match(/^(https?):\/\/(.+)$/i);
    const ua = navigator.userAgent;
    let href = url;
    if (/android/i.test(ua)) {
      href = `intent://${m[2]}#Intent;scheme=${m[1].toLowerCase()};package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(url)};end`;
    } else if (/iphone|ipad|ipod/i.test(ua)) {
      href = (m[1].toLowerCase() === 'https' ? 'googlechromes://' : 'googlechrome://') + m[2];
    }
    $('open').href = href;
    $('open').hidden = false;
    if (!num) $('n').textContent = url;
  }
  if (!num && $('open').hidden) $('none').hidden = false;
</script></body></html>
